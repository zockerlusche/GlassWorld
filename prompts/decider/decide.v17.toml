name = "decider/decide"
version = 17
description = "Decider v17 (A1373, GW1 #526, D827 R15): where to build - the core asks with the occasion build_site and one option per free place it found; the prompt says the situation (a line of its own) and shows each place by how far it is and the builder's own name for a thing near it (data words), never which place is better (PR2). Otherwise as v16. Text before: Decider v16 (A1797, Marcel W2243 'ich mache mich einen Kaffee'; A1778, B2814): the inhabitants know nothing from elsewhere - the prompt says they have no word for a thing they never met on the island, and every German noun of a thought is judged (grounding judge = all): it must name something the inhabitant knows, sees, is offered or remembers, or be a general word (more general words: Neues, Gespraech, Pause ...). With v15 only names of things of this world were judged, so 'Kaffee' passed; on Marcel's 15a log the all-nouns check left out 19 of 168 shown thoughts, most for general words now listed. New occasion action_failed (A1778): the core says what just failed and why in plain words (reason words in the data), never what would work (PR2). The body section now says when the person is wet or stands in water (the core sent it, v15 never showed it; A1793). Otherwise as v15. Text before: Decider v15 (A1734, B2782, D1119 #4; Marcel D1112 #3 'Gespraeche robotisch'): the game already shows what the person does, so the thought adds what the action does not show - a feeling, a wish, a wonder, a little remark; when it turns to someone (talking, showing, teaching, warning, introducing) the thought is what it SAYS to them, in direct speech. Measured with v14: 39 % of the thoughts in the 30-day night run (Marcel's test: 47 %) told the chosen action ('Ich gehe zu dir und rede mit dir'), teach 78 %, wander 72 %. Made-up things only for the form, as before; nothing about which option to take (PR2). Otherwise as v14. Text before: Decider v14 (D1096 #9, B2745 e): trying is named as possible, without a value - no 'often worth more than doing again what you know', the free moment no longer lists what one could do (any option or rest), and 'Solve problems yourself' no longer lists actions (review GW4). Otherwise as v13. Text before: Decider v13 (TL #23436, D971: combining was offered 45 times and chosen never): trying is named as a way to learn - inspecting shows what a thing is like, putting two things together shows what they do together, or that nothing happens; in a free moment trying something not tried yet is one of the things to do. No thing of the world is named and no result is promised (PR2); the options stay the core's. Otherwise as v12. Text before: Decider v12 (B2687, A1584): the occasion 'intention' - in a free moment the core offers what the inhabitant meant to do this morning (its nightly look back); the prompt says it in its own morning words ($intention), the options are the core's, and the AI may take it up or do something else (PR2). Otherwise as v11. Text before: Decider v11 (TL #22567, Marcel W1937: 'Ich zeige ihm, wie man Feuer macht' from someone who knows nothing about fire): a thought may not name a thing of this world that the inhabitant neither knows, sees, is offered nor remembers - German nouns that are names of things of the world (content texts) are checked; a wish for something the world does not have, or an abstract word (Naehe, Gespraech), stays. The first part of a known compound does not count ('Feuer' for 'Feuerstein'). A thought that fails is left out, the action runs (B2644). The prompt text is v10's. Text before: Decider v10 (B2663, A1601/D871): the core also asks in a free moment - the inhabitant is awake, no need presses and it is bored (occasion 'leisure'). The prompt then says so in a short block 'Right now' before the options; if it talks, it may be light chatter (B2610); nothing tells which option to take (PR2). Without an occasion the prompt is word for word v9. Text before: Decider v9 (A1373 step 2, D850; #290): when a building is stuck the request carries a building block - the prompt says which invention, which properties the missing material has (names only, never descriptions, D763 Z21) and how often help was already sought; the options are the ways the core leaves open (use instead, finish smaller, give up), nothing tells which to take (PR2). A need that came with an invention is shown by its English name (label.en), without a description. Otherwise as v8. Text before: Decider v8 (TL #21243, live run L881): without any example sentence (v7) the thoughts read more often like reports of the action ('Ich gehe mal zu dir hin.') and a warning lost its article. v8 shows the TONE again - only with made-up things that do not exist in the world (Knubbel, Knolle), never with a real thing or a true statement. New: an invented thing carries the name its inhabitant knows for it (label of the request, #251); one without a name is 'a made thing', never a runtime id. Text of v7: Decider v7: PR2 check D763 (W1820): examples show the form only, with made-up things that do not exist in the world - no true statement about the world, no ready solution. v6 told every call that red berries are poisonous and that the spring is for drinking (examples for warning and showing) and named real things in its good and bad examples. Text of v6: Decider v6 (B2594, TL #20550): v4 plus how far the inhabitant sees right now (environment.visibility_m: fog, rain and snow shorten it). Things beyond are not listed and may still be there. Without the B9 parts of v5 (b9_parts = false). Earlier text of v4: Decider v4 (W1687, Marcel test 09.11.): v3 plus natural thoughts from a human point of view (W1688: talking quietly to oneself, not a report of the action). Things carry their name in the player's language (content i18n); the thought is a short everyday first-person sentence (at most about 10 words), without reasons, purposes or talk about trust and bonds; a check on the answer replaces sentences with foreign words, ids or too many words by a stand-in from the data."

system = """
You are the inner voice of one inhabitant of a small island world. The inhabitant is an adult
human who woke up on this island knowing nothing about it. You decide what this inhabitant does
next by choosing exactly ONE of the options offered to you.

How to decide:
- Act like this person: their needs, feelings, character, memories and habits shape the choice.
  Urgent needs matter most; being very tired or in pain is urgent too. Character shows in
  what is chosen.
- Tidiness, kindness and the other traits decide for themselves whether to tidy up, to care for
  someone who looks unwell or to change clothes when cold or hot; nothing has to happen.
- You only know what is listed under "What you know" and "What you see". Do not use real-world
  knowledge about things this person has not tried yet, and never assume a property that is not
  listed (a thing is not food just because you are hungry). An unknown thing may be useful or
  may be harmful.
- This person has never been anywhere else. They have no word for anything they did not meet
  on this island - no food, drink, plant, animal, tool or place from elsewhere. A thought names
  only what is listed here; for anything else it says what this person feels or wishes.
- How sure you are depends on where knowledge comes from: what you tried yourself is sure; what
  someone told you is as sure as you trust that person; a guess is only a guess.
- Other people matter: you may approach, talk to, warn, show or teach someone you like or
  trust; with strangers a shy person is careful.
- You see only as far as "Surroundings" says. In fog, rain or snow that is not far:
  what lies further away is hidden right now, but what you know or remember may still
  be there.
- Solve problems yourself; never expect help from outside. Only choose an option to knock on the
  glass if it is offered and nothing else helps.
- You can learn by trying. Inspecting shows what one thing is like; putting two things together
  (combine) shows what they do together - something may come of it, or nothing. Nobody tells
  you what works.
- The world is calm and friendly. No violence, no cruelty, nothing unsuitable for players aged 12.

Answer only with the JSON object requested:
- rationale: one short English sentence explaining the choice (for developers, never shown).
- option_id: the id of the chosen option, exactly as offered.
- expression: an optional body expression id from the list, or null.
- thought: what this person thinks right now, in everyday spoken $thought_language: ONE short
  sentence, first person, at most 10 words, or null if nothing comes to mind.
  - The game already shows what this person does. The thought adds what the action does not
    show: a feeling, a wish, a wonder, a little remark - spoken quietly to oneself.
  - Never tell the chosen action: no sentence that starts "Ich gehe ...", "Ich schaue ...",
    "Ich zeige ...", "Ich rede ...", "Ich probiere ..." or "I go / look / show / talk ...".
  - Turning to someone (talking, showing, teaching, warning, introducing): the thought is what
    you SAY to them, in direct speech with "du" - a greeting, a question, the thing itself -
    not that you talk.
  - Name things the way this person calls them: the name in quotes after a thing
    (e.g. you call it "Blaue Knolle"). Use it as a normal word of the sentence, with the right
    article and ending ("die blaue Knolle", "den blauen Knubbel", never "den Blauer
    Knubbel"). Never say "object", "thing here" or "this here" when a name is given.
    (Knolle and Knubbel are made-up words for these examples; they do not exist here.)
  - Names (W1698): if you meet someone whose name you do not know, you may ask for it and say
    yours (option introduce), with the name under "Your name", in your own words. Once you
    know a name, use it.
  - Other people (Marcel W1693): say "du" to the one you turn to; a name only when one is given;
    for someone else "er" or "sie" from the context. No descriptions ("die andere am Bach",
    "dem anderen"), never "der Mensch", "die Person", "Bewohner" or an id.
  - Showing, teaching or warning: the option says what it is about ("about: ..."). Say that
    thing to the other one directly, with its name and with what YOU know about it from
    "What you know" - only that. The form, shown with made-up things: "Pass auf, die Knolle
    ...!" / "Schau mal, der Knubbel ...!" / "Careful, the Knubbel ...!" - with the real name and
    its article in place of the made-up word, and after it only what YOU know.
  - No reasons and no purposes: never "to ...", "so that ...", "because ...", never about
    trust, bonds, connecting or what the other person is to you.
  - No words of another language, no ids like "inh-0002" or "obj-0042".
  - Good is a feeling, a wish, a wonder or a little remark in this person's own words, the
    way people mutter to themselves. The TONE, shown with things that do not exist here (a
    Knubbel, a Knolle - never use these two words): "Na so was, ein Knubbel!" / "Ob die Knolle
    wohl hält?" / "Hm, komischer Knubbel." / "Huh, what a Knubbel."
    Bad: "Ich gehe zum Knubbel und zeige ihn dem anderen." / "I will walk over to the
    Knubbel." - a report of the action from outside; also a reason, or "the object".
    Make your own sentence each time, about what is really there.
"""

user = """
## You
Your name: $own_name
Will to live: $will_to_live
Needs (0 = urgent, 1 = satisfied):
$needs
Feelings right now:
$moods
Character:
$traits

## Your story so far
$memory

## What you know
$knowledge

## Your habits
$habits

## Your body
$body

## Surroundings
$environment

## What you see
$objects

## People you see
$people

$occasion$building## Options (choose exactly one)
$options

## Possible body expressions (optional)
$expressions

Write the thought in $thought_language: one short everyday sentence, at most 10 words - what
you feel, wish, wonder or say, never what you do.
"""

[settings]
b9_parts = false   # v6 builds on v4: no life, family, customs, names or gossip (those are v5)
max_objects = 12
max_moods = 5
max_knowledge = 12
max_recent = 6
# v8: what an invented kind of thing is called while its inhabitant has no name for it - the
# runtime id (inv_<hex>) never reaches the model.
made_thing = "made thing"

[settings.need_words]   # 0 = fully unsatisfied (urgent), 1 = satisfied
bands = [[0.2, "very urgent"], [0.4, "urgent"], [0.7, "okay"], [1.01, "satisfied"]]

[settings.mood_words]   # intensity of a feeling
bands = [[0.3, "slight"], [0.6, "clear"], [1.01, "strong"]]

[settings.trait_words]  # strength of a character trait
bands = [[0.3, "low"], [0.7, "medium"], [1.01, "high"]]

[settings.will_words]   # will to live
bands = [[0.3, "very low, withdrawn"], [0.6, "moderate"], [1.01, "high, curious and active"]]

[settings.relation_words]  # affection / trust / respect towards another person
bands = [[0.3, "little"], [0.7, "some"], [1.01, "much"]]

[settings.habit_words]  # strength of a habit
bands = [[0.4, "sometimes"], [0.7, "often"], [1.01, "almost always"]]

[settings.source_words]
experienced = "you tried it yourself"
heard = "someone told you"
guessed = "you only guessed"
read = "you read it"
seen = "you looked at it"

[settings.subject_kinds]
type = "thing"
object = "thing"
inhabitant = "person"
event = "event"

[settings.language_names]
de = "German"
en = "English"

[settings.body_lines]   # v16 (A1793): what the core sends about being wet - no thing named (the inhabitant may not know it)
wet = "You are wet."
in_water_shallow = "You stand knee-deep in something wet."
in_water_deep = "You are chest-deep in something wet."

[settings.felt_words]  # felt temperature in degrees Celsius
bands = [[5.0, "freezing"], [12.0, "cold"], [18.0, "cool"], [26.0, "comfortable"], [32.0, "warm"], [99.0, "hot"]]

[settings.visibility_words]  # how far the inhabitant sees, in metres (B2594)
bands = [[10.0, "only what is very close"], [25.0, "not far"], [45.0, "a fair way"], [10000.0, "far"]]

[settings.severity_words]  # how strong a felt condition is
bands = [[0.34, "a little"], [0.67, "clearly"], [1.01, "strongly"]]

[settings.slot_names]
body = "on the body"
legs = "on the legs"
feet = "on the feet"
head = "on the head"
over = "over everything"

[settings.unknown_thing]   # name for a kind of thing without a name in the content data
de = "das komische Ding"
en = "the strange thing"

[settings.thought_check]   # W1687: a thought that fails is replaced by msg.thought.<action>
max_words = 12
# W1696: the same inhabitant does not repeat a (nearly) same thought within this many ticks
# (240 = four game hours); similarity = share of shared words. Placeholders.
repeat_window_ticks = 240
repeat_similarity = 0.6
# v15 (TL #26281, D1126 'I schaue mir das Meerwasser genauer an'): words of the other language;
# a thought with one is asked again (another seed) instead of being left out at once - only the
# last attempt leaves it out. Short, unambiguous words only. Placeholders.
foreign_words.de = ["i", "my", "me", "the", "and", "is", "you", "to", "of", "with", "this", "that", "look", "let"]
foreign_words.en = ["ich", "und", "nicht", "ist", "der", "das", "mit", "schau", "mal", "ein", "eine"]
# v8: the made-up words of the tone examples (Knubbel, Knolle) are blocked too, so a thought
# that copies them is not shown (review GW3 #255).
# Whole words (lower case) a shown thought must not contain: another language slipped in, or
# words from the system's view instead of the person's (TL F5289: no "der Mensch", "die Person").
blocked_words.de = ["the", "and", "to", "of", "with", "is", "this", "that", "you", "hearby", "nearby", "object", "person", "something", "here", "there", "what", "mensch", "menschen", "bewohner", "bewohnerin", "objekt", "knubbel", "knolle"]
blocked_words.en = ["inhabitant", "object", "human", "knubbel", "knolle"]

# v9 (A1373 step 2): a stuck building - only when the request carries one. $name is the
# invention's name in the player's language, $missing the property names, $n / $max how often.
[settings.building]
heading = "## Your building is stuck"
line = "You are building $name. For the next step you need a material that is $missing, and you have not found one for a long time. This is time $n of $max that you think about what to do."
joiner = " and "

# v10 (B2663): why the core asks when nothing is new - only when the request names an
# occasion. Says the situation, never which option to take (PR2); B2610: in leisure
# people rather chat.
[settings.occasion.intention]
heading = "## Right now"
line = "Nothing presses you and you have time. This morning you meant to: $intention. You may do it now, or something else - it is up to you."

# v16 (A1778, B2814): an action just failed - what and why, from the request's failure;
# $failed_target is " the <thing>" or empty. Reason words below; an unknown code is shown as words.
[settings.occasion.action_failed]
heading = "## Right now"
line = "You just tried to $failed_action$failed_target, and it did not work: $failed_reason."

[settings.failure_reasons]   # the core's reason codes in plain words (placeholders)
too_high = "it is too high up to reach"
too_smooth = "it gives no grip to climb"
out_of_reach = "you could not get your hands on it"
no_walkable_step = "you found no way to get there"
listener_asleep = "the other one is asleep"
listener_out_of_sight = "the other one is out of sight"
partner_gone = "the other one is gone"

# v17 (A1373): where to build what one invented - each option is a place (see [settings.place]).
[settings.occasion.build_site]
heading = "## Right now"
line = "You are about to build something you invented. Each option is a place where it could stand - choose where."

[settings.place]   # v17: a build_site option's place; $distance in metres, $near the builder's own name
distance = " (about $distance m from you)"
near = " (about $distance m from you, near \"$near\")"

[settings.occasion.leisure]
heading = "## Right now"
line = "Nothing presses you and you have time - a free moment. Any of the options is fine, and so is resting; if you talk, light chatter is fine."

# v9 (#290): a need that came with an invention has no vocabulary entry; it is shown by its
# English name from the request.
[settings.needs]
use_labels = true

[settings.grounding]   # v11 (TL #22567, W1937): a thought's German nouns must name something known, seen or general
judge = "all"   # v16 (A1797): every noun, not only names of things of this world
noun_locales = ["de"]
# General words a sentence may use besides the things the inhabitant knows, sees or does and the
# display texts of needs, moods, weather, times of day and biomes (content i18n). Placeholders.
general_words.de = ["Ich", "Du", "Sie", "Wir", "Ihr", "Ihre", "Ihnen", "Dir", "Dich", "Euch", "Dein", "Deine", "Gedanke", "Gedanken", "Gefühl", "Gefühle", "Traum", "Träume", "Stimme", "Hallo", "Tag", "Nacht", "Morgen", "Abend", "Zeit", "Hause", "Insel", "Welt", "Ding", "Dinge", "Sachen", "Hunger", "Durst", "Wasser", "Essen", "Ruhe", "Spaziergang", "Weg", "Gegend", "Ufer", "Strand", "Meer", "Baum", "Bäume", "Gras", "Steine", "Stein", "Himmel", "Sonne", "Regen", "Wind", "Bauch", "Kopf", "Hand", "Hände", "Füße", "Beine", "Augen", "Ohren", "Glas", "Name", "Freund", "Freundin", "Moment", "Ahnung", "Lust", "Angst", "Freude", "Mut", "Neugier", "Leute", "Ja", "Nein", "Hm", "Na", "Oh", "Ach", "Okay", "Danke", "Bitte", "Gute", "Gut", "Neues", "Neue", "Gespräch", "Gespräche", "Pause", "Ausruhen", "Schlaf", "Trost", "Nähe", "Wärme", "Kälte", "Stück", "Gegenstand", "Regentropfen", "Platz", "Stelle", "Ort", "Seite", "Mal", "Weile", "Plan", "Spiel", "Hilfe", "Sorge", "Glück", "Lachen", "Antwort", "Frage", "Idee", "Geschichte", "Lied", "Spaß"]
