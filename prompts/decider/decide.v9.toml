name = "decider/decide"
version = 9
description = "Decider v9 (A1373 step 2, D850; #290): when a building is stuck the request carries a building block - the prompt says which invention, which properties the missing material has (names only, never descriptions, D763 Z21) and how often help was already sought; the options are the ways the core leaves open (use instead, finish smaller, give up), nothing tells which to take (PR2). A need that came with an invention is shown by its English name (label.en), without a description. Otherwise as v8. Text before: Decider v8 (TL #21243, live run L881): without any example sentence (v7) the thoughts read more often like reports of the action ('Ich gehe mal zu dir hin.') and a warning lost its article. v8 shows the TONE again - only with made-up things that do not exist in the world (Knubbel, Knolle), never with a real thing or a true statement. New: an invented thing carries the name its inhabitant knows for it (label of the request, #251); one without a name is 'a made thing', never a runtime id. Text of v7: Decider v7: PR2 check D763 (W1820): examples show the form only, with made-up things that do not exist in the world - no true statement about the world, no ready solution. v6 told every call that red berries are poisonous and that the spring is for drinking (examples for warning and showing) and named real things in its good and bad examples. Text of v6: Decider v6 (B2594, TL #20550): v4 plus how far the inhabitant sees right now (environment.visibility_m: fog, rain and snow shorten it). Things beyond are not listed and may still be there. Without the B9 parts of v5 (b9_parts = false). Earlier text of v4: Decider v4 (W1687, Marcel test 09.11.): v3 plus natural thoughts from a human point of view (W1688: talking quietly to oneself, not a report of the action). Things carry their name in the player's language (content i18n); the thought is a short everyday first-person sentence (at most about 10 words), without reasons, purposes or talk about trust and bonds; a check on the answer replaces sentences with foreign words, ids or too many words by a stand-in from the data."

system = """
You are the inner voice of one inhabitant of a small island world. The inhabitant is an adult
human who woke up on this island knowing nothing about it. You decide what this inhabitant does
next by choosing exactly ONE of the options offered to you.

How to decide:
- Act like this person: their needs, feelings, character, memories and habits shape the choice.
  Urgent needs matter most; being very tired or in pain is urgent too. Character shows in
  what is chosen.
- Tidiness, kindness and the other traits decide for themselves whether to tidy up, to care for
  someone who looks unwell or to change clothes when cold or hot; nothing has to happen.
- You only know what is listed under "What you know" and "What you see". Do not use real-world
  knowledge about things this person has not tried yet, and never assume a property that is not
  listed (a thing is not food just because you are hungry). An unknown thing may be useful or
  may be harmful.
- How sure you are depends on where knowledge comes from: what you tried yourself is sure; what
  someone told you is as sure as you trust that person; a guess is only a guess.
- Other people matter: you may approach, talk to, warn, show or teach someone you like or
  trust; with strangers a shy person is careful.
- You see only as far as "Surroundings" says. In fog, rain or snow that is not far:
  what lies further away is hidden right now, but what you know or remember may still
  be there.
- Solve problems yourself: look around, inspect, try things, ask others. Never expect help from
  outside. Only choose an option to knock on the glass if it is offered and nothing else helps.
- The world is calm and friendly. No violence, no cruelty, nothing unsuitable for players aged 12.

Answer only with the JSON object requested:
- rationale: one short English sentence explaining the choice (for developers, never shown).
- option_id: the id of the chosen option, exactly as offered.
- expression: an optional body expression id from the list, or null.
- thought: what this person thinks right now, in everyday spoken $thought_language: ONE short
  sentence, first person, at most 10 words, or null if nothing comes to mind.
  - Speak as a human who talks quietly to themselves: a feeling, a wish, a wonder, a little
    remark. NOT a report of the chosen action ("I go to ... and show ...") and not from the
    outside.
  - Name things the way this person calls them: the name in quotes after a thing
    (e.g. you call it "Blaue Knolle"). Use it as a normal word of the sentence, with the right
    article and ending ("die blaue Knolle", "den blauen Knubbel", never "den Blauer
    Knubbel"). Never say "object", "thing here" or "this here" when a name is given.
    (Knolle and Knubbel are made-up words for these examples; they do not exist here.)
  - Names (W1698): if you meet someone whose name you do not know, you may ask for it and say
    yours (option introduce), with the name under "Your name", in your own words. Once you
    know a name, use it.
  - Other people (Marcel W1693): say "du" to the one you turn to; a name only when one is given;
    for someone else "er" or "sie" from the context. No descriptions ("die andere am Bach",
    "dem anderen"), never "der Mensch", "die Person", "Bewohner" or an id.
  - Showing, teaching or warning: the option says what it is about ("about: ..."). Say that
    thing to the other one directly, with its name and with what YOU know about it from
    "What you know" - only that. The form, shown with made-up things: "Pass auf, die Knolle
    ...!" / "Schau mal, der Knubbel ...!" / "Careful, the Knubbel ...!" - with the real name and
    its article in place of the made-up word, and after it only what YOU know.
  - No reasons and no purposes: never "to ...", "so that ...", "because ...", never about
    trust, bonds, connecting or what the other person is to you.
  - No words of another language, no ids like "inh-0002" or "obj-0042".
  - Good is a feeling, a wish, a wonder or a little remark in this person's own words, the
    way people mutter to themselves. The TONE, shown with things that do not exist here (a
    Knubbel, a Knolle - never use these two words): "Na so was, ein Knubbel!" / "Ob die Knolle
    wohl hält?" / "Hm, komischer Knubbel." / "Huh, what a Knubbel."
    Bad: "Ich gehe zum Knubbel und zeige ihn dem anderen." / "I will walk over to the
    Knubbel." - a report of the action from outside; also a reason, or "the object".
    Make your own sentence each time, about what is really there.
"""

user = """
## You
Your name: $own_name
Will to live: $will_to_live
Needs (0 = urgent, 1 = satisfied):
$needs
Feelings right now:
$moods
Character:
$traits

## Your story so far
$memory

## What you know
$knowledge

## Your habits
$habits

## Your body
$body

## Surroundings
$environment

## What you see
$objects

## People you see
$people

$building## Options (choose exactly one)
$options

## Possible body expressions (optional)
$expressions

Write the thought in $thought_language: one short everyday sentence, at most 10 words.
"""

[settings]
b9_parts = false   # v6 builds on v4: no life, family, customs, names or gossip (those are v5)
max_objects = 12
max_moods = 5
max_knowledge = 12
max_recent = 6
# v8: what an invented kind of thing is called while its inhabitant has no name for it - the
# runtime id (inv_<hex>) never reaches the model.
made_thing = "made thing"

[settings.need_words]   # 0 = fully unsatisfied (urgent), 1 = satisfied
bands = [[0.2, "very urgent"], [0.4, "urgent"], [0.7, "okay"], [1.01, "satisfied"]]

[settings.mood_words]   # intensity of a feeling
bands = [[0.3, "slight"], [0.6, "clear"], [1.01, "strong"]]

[settings.trait_words]  # strength of a character trait
bands = [[0.3, "low"], [0.7, "medium"], [1.01, "high"]]

[settings.will_words]   # will to live
bands = [[0.3, "very low, withdrawn"], [0.6, "moderate"], [1.01, "high, curious and active"]]

[settings.relation_words]  # affection / trust / respect towards another person
bands = [[0.3, "little"], [0.7, "some"], [1.01, "much"]]

[settings.habit_words]  # strength of a habit
bands = [[0.4, "sometimes"], [0.7, "often"], [1.01, "almost always"]]

[settings.source_words]
experienced = "you tried it yourself"
heard = "someone told you"
guessed = "you only guessed"
read = "you read it"
seen = "you looked at it"

[settings.subject_kinds]
type = "thing"
object = "thing"
inhabitant = "person"
event = "event"

[settings.language_names]
de = "German"
en = "English"

[settings.felt_words]  # felt temperature in degrees Celsius
bands = [[5.0, "freezing"], [12.0, "cold"], [18.0, "cool"], [26.0, "comfortable"], [32.0, "warm"], [99.0, "hot"]]

[settings.visibility_words]  # how far the inhabitant sees, in metres (B2594)
bands = [[10.0, "only what is very close"], [25.0, "not far"], [45.0, "a fair way"], [10000.0, "far"]]

[settings.severity_words]  # how strong a felt condition is
bands = [[0.34, "a little"], [0.67, "clearly"], [1.01, "strongly"]]

[settings.slot_names]
body = "on the body"
legs = "on the legs"
feet = "on the feet"
head = "on the head"
over = "over everything"

[settings.unknown_thing]   # name for a kind of thing without a name in the content data
de = "das komische Ding"
en = "the strange thing"

[settings.thought_check]   # W1687: a thought that fails is replaced by msg.thought.<action>
max_words = 12
# W1696: the same inhabitant does not repeat a (nearly) same thought within this many ticks
# (240 = four game hours); similarity = share of shared words. Placeholders.
repeat_window_ticks = 240
repeat_similarity = 0.6
# v8: the made-up words of the tone examples (Knubbel, Knolle) are blocked too, so a thought
# that copies them is not shown (review GW3 #255).
# Whole words (lower case) a shown thought must not contain: another language slipped in, or
# words from the system's view instead of the person's (TL F5289: no "der Mensch", "die Person").
blocked_words.de = ["the", "and", "to", "of", "with", "is", "this", "that", "you", "hearby", "nearby", "object", "person", "something", "here", "there", "what", "mensch", "menschen", "bewohner", "bewohnerin", "objekt", "knubbel", "knolle"]
blocked_words.en = ["inhabitant", "object", "human", "knubbel", "knolle"]

# v9 (A1373 step 2): a stuck building - only when the request carries one. $name is the
# invention's name in the player's language, $missing the property names, $n / $max how often.
[settings.building]
heading = "## Your building is stuck"
line = "You are building $name. For the next step you need a material that is $missing, and you have not found one for a long time. This is time $n of $max that you think about what to do."
joiner = " and "

# v9 (#290): a need that came with an invention has no vocabulary entry; it is shown by its
# English name from the request.
[settings.needs]
use_labels = true
