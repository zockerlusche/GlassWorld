name = "memory/condense"
version = 6
description = "Memory condensation v6: an invented kind of thing without a name of its own is 'made thing' in the event lines - the runtime id inv_<hex> never reaches the memory text that later prompts read (a named one carries its label since v3). Text before: Memory condensation v5: PR2 check D763 (W1820), found by the sharper guard test (display names, head nouns, settings): v4 still said 'drinking water again' as its example of a small thing. Text of v4: Memory condensation v4: PR2 check D763 (W1820): examples show the form only, with made-up things that do not exist in the world - no true statement about the world, no ready solution. v1 to v3 showed the diary form with a true statement about the world (red berries, stomach ache). Text of v3: Memory condensation v3 (review of #227, A1486): the core now says what came of an action (outcome), how often it was repeated (times) and what the inhabitant calls a person or invention (label). An attempt without effect is told as an attempt, never as done (v1/v2 wrote 'Drank flint'); repeats are one line with a count; people carry the name the inhabitant has learned instead of an id. Text of v2: Memory condensation v2 (review of #227, run L838/L839): jobs from the real core carry several events of one tick and many formative events on the first nights; the model then named a tick twice and left another out, three attempts in a row. Now one line per tick, and the formative ticks are listed once more as the exact content of kept. Text of v1: Memory condensation (B4a S4, R5): the summary so far and new events become one short summary within a hard character budget. Formative events must stay. English, internal (the decider reads it as 'Your story so far')."

system = """
You keep the memory of one inhabitant of a small island world. You get the memory so far and
some new events. Write ONE new memory text that replaces the old one.

Rules:
- English, past tense, short plain sentences without "I", like a diary: "Met another person.
  Looked at a new thing for a long time."
- Every event marked FORMATIVE must stay clearly in the text: pain, a first encounter, a big
  success or loss shape a life. Several things can happen at one tick; they share one line.
  "kept" is exactly the list under "Formative ticks": every tick of it once, nothing else.
- Merge or drop small things (what was done again and again, walking around) when space is
  short.
  Older details may fade, but never drop a formative event.
- An event that begins with "tried to" is an attempt that did not do what was hoped: write it as
  an attempt ("Tried to <do that> with <the thing>; it did not work." - with the action and
  the thing of the event, without the angle brackets), never as done. Add no
  consequence the event does not name (no pain, no sickness, no success).
- Use the names given in quotes. Never write ids like "inh-000002"; someone without a name is
  "another person".
- Only what the events say. Do not invent facts, reasons or properties. A belief stays a belief
  ("seemed friendly", "thought it was edible").
- At most $max_chars characters. Shorter is fine.
- Calm and suitable for players aged 12.

Answer only with the JSON object requested:
- summary: the new memory text.
- kept: the numbers listed under "Formative ticks", each once.
"""

user = """
## Memory so far
$summary

## New events (oldest first)
$events

## Formative ticks ($formative_count)
$formative

Write the new memory in at most $max_chars characters.
"""

[settings.events]
one_line_per_tick = true
unnamed_person = "another person"
made_thing = "made thing"   # an invented kind without a name of its own (never inv_<hex>)
times = "$what, $times times in all"

# What came of an action, as the core reports it (common#MemoryOutcome). $what is the action
# with what it was about.
# found_out is worded as a failed attempt: right for eating or drinking the wrong thing, which
# is where the core sets it today (memory.events with_outcome). An action whose purpose is
# finding out would need its own phrase before it gets an outcome.
[settings.outcome_phrases]
done = "$what"
found_out = "tried to $what - it did not work, but something was learned from it"
nothing = "tried to $what - nothing happened"

[settings.subject_kinds]
type = "thing"
object = "thing"
inhabitant = "person"
event = "event"
