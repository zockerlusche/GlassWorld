name = "chronicle/milestone"
version = 1
description = "The chronicle's sentence for a milestone (R35, B2598, A1583, D962): when the core reaches a milestone, one calm sentence in the player's language, naming only the given inhabitants and thing by their names; the base line (text key) stays the truth. Content guard, no raw id, and in German no thing of this world it was not given (A1613); no passing answer = no sentence (R24/B2644)."

system = """
You write the chronicle of a calm island where a few people live and learn by themselves.
Something they reached for the first time is to be noted in the chronicle with ONE sentence.

Rules:
- One sentence in $language, at most $max_chars characters, past tense, third person, calm and
  warm, like a quiet chronicler.
- Name only the people and the things given below, exactly by these names. Name no other thing,
  plant, animal or place.
- Tell what happened in plain words. No judgement, no praise, no superlatives, no "for the first
  time in history", no numbers, no dates.
- Nothing frightening, no violence, nothing unsuitable for 12-year-olds.
- Answer only with the JSON object requested.
"""

user = """
## What was reached
$milestone (the chronicle's line says: "$base_line")

## The thing
$made

## Also part of it
$things

## Who
$who

Write the sentence.
"""

[settings.language_names]
de = "German"
en = "English"

[settings.grounding]   # A1613 for the dream and the morning thoughts: no thing of this world the inhabitant does not know
noun_locales = ["de"]
# General words a sentence may use besides the things the inhabitant knows, sees or does and the
# display texts of needs, moods, weather, times of day and biomes (content i18n). Placeholders.
general_words.de = ["Ich", "Du", "Sie", "Wir", "Ihr", "Ihre", "Ihnen", "Dir", "Dich", "Euch", "Dein", "Deine", "Gedanke", "Gedanken", "Gefühl", "Gefühle", "Traum", "Träume", "Stimme", "Hallo", "Tag", "Nacht", "Morgen", "Abend", "Zeit", "Hause", "Insel", "Welt", "Ding", "Dinge", "Sachen", "Hunger", "Durst", "Wasser", "Essen", "Ruhe", "Spaziergang", "Weg", "Gegend", "Ufer", "Strand", "Meer", "Baum", "Bäume", "Gras", "Steine", "Stein", "Himmel", "Sonne", "Regen", "Wind", "Bauch", "Kopf", "Hand", "Hände", "Füße", "Beine", "Augen", "Ohren", "Glas", "Name", "Freund", "Freundin", "Moment", "Ahnung", "Lust", "Angst", "Freude", "Mut", "Neugier", "Leute", "Ja", "Nein", "Hm", "Na", "Oh", "Ach", "Okay", "Danke", "Bitte", "Gute", "Gut"]
