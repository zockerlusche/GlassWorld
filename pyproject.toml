[project]
name = "glassworld-workspace"
version = "0.0.0"
description = "uv workspace root for the Python parts of GlassWorld (not a package)."
requires-python = ">=3.12,<3.13"
dependencies = ["glassworld-contracts"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts/python"]

[tool.uv.sources]
glassworld-contracts = { workspace = true }

[dependency-groups]
dev = [
    "datamodel-code-generator==0.90.0",
    "jsonschema==4.25.1",
    "pyright==1.1.414",
    "pytest==8.4.2",
    "ruff==0.14.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts/python/src/glassworld_contracts/models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["contracts"]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
