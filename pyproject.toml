[project]
name = "glassworld-workspace"
version = "0.0.0"
description = "uv workspace root for the Python parts of GlassWorld (not a package)."
requires-python = ">=3.12,<3.13"
dependencies = ["glassworld-contracts", "glassworld-ai-service"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts/python", "ai-service"]

[tool.uv.sources]
glassworld-contracts = { workspace = true }
glassworld-ai-service = { workspace = true }

[dependency-groups]
dev = [
    "datamodel-code-generator==0.90.0",
    "jsonschema==4.25.1",
    "pyright==1.1.414",
    "pytest==8.4.2",
    "ruff==0.14.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts/python/src/glassworld_contracts/models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# data-heavy generator for the AI test sets (long descriptive strings)
"tools/testsets/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["glassworld_ai", "glassworld_contracts", "conftest"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["contracts", "ai-service"]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["ai-service/tests"]
testpaths = ["contracts", "ai-service", "tools/licenses", "tools/durchstich", "tools/release", "tools/b4a", "tools/testsets", "tools/bench", "tools/worldgen"]
