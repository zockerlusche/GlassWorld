# Default configuration of the GlassWorld AI service.
# Every value can be overridden by an environment variable GW_AI_<NAME> (e.g. GW_AI_OLLAMA_URL)
# or by a local .env file (see .env.example). The session token is never stored here.

# External programs: detected by the service, never started by it (ADR-0006).
ollama_url = "http://127.0.0.1:11434"
comfyui_url = "http://127.0.0.1:8188"

# Decider and rule guard model (ADR-0001, ADR-0005). Pinned by digest prefix because tags can move.
decider_model = "qwen3.5:9b"
decider_model_digest = "56671c2ab938"

# Seconds a single health probe may take.
probe_timeout_s = 2.0

# Hardware tiers and thresholds (data, not code). Relative paths are relative to this file.
hardware_tiers_file = "../content/hardware/tiers.json"
