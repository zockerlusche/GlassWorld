# Default configuration of the GlassWorld AI service.
# Every value can be overridden by an environment variable GW_AI_<NAME> (e.g. GW_AI_OLLAMA_URL)
# or by a local .env file (see .env.example). The session token is never stored here.

# External programs (ADR-0006). Ollama: the player's own is used; otherwise the game offers the
# download (B10 R3) and the service starts the loaded one on this localhost address.
ollama_url = "http://127.0.0.1:11434"
ollama_runtime_file = "../content/ai/ollama-runtime.json"
ollama_install_dir = "../.local/ai-service/ollama"   # the game sets GW_AI_OLLAMA_INSTALL_DIR
model_downloads_file = "../content/ai/model-downloads.json"  # B10 R4: models per tier
model_store_dir = "../.local/ai-service/model-store"     # the game sets GW_AI_MODEL_STORE_DIR
comfyui_url = "http://127.0.0.1:8188"

# Decider and rule guard model (ADR-0001, ADR-0005). Pinned by digest prefix because tags can move.
decider_model = "qwen3.5:9b"
decider_model_digest = "56671c2ab938"

# Seconds a single health probe may take.
probe_timeout_s = 2.0

# Hardware tiers and thresholds (data, not code). Relative paths are relative to this file.
hardware_tiers_file = "../content/hardware/tiers.json"
model_footprints_file = "../content/hardware/models.json"   # B7 S2 residency
night_plan_file = "../content/hardware/night.json"          # B7 S4 day/night planner
benchmark_file = "../.local/ai-service/benchmark.json"     # B7 S7 measurement run (result)
benchmark_on_first_start = false                            # the game turns it on; dev runs measure on demand
image_backend = "mock"                                      # B7 S5: "comfyui" for the local image model
image_output_dir = "../.local/ai-service/images"            # made pictures by name pattern
image_workflows_dir = "../tools/comfyui/workflows"          # workflow templates (API format)
# --- Decider (B3) ---
# ollama = real model, mock = deterministic stand-in (CI), replay = answers from the call log
decider_backend = "ollama"
sound_backend = "mock"            # D471 D7: "moss" with moss_python/moss_model_dir/moss_code_dir (local, GW_AI_*)
decider_prompt = "decider/decide"
decider_prompt_version = 13       # TL #23436: v12 plus trying (combine) named as a way to learn
temperature = 0.7          # technical start value, decided by TL (AMW #18519)
num_ctx = 8192
prompt_char_budget = 6000
max_retries = 2            # engineering handbook: at most two retries
queue_size = 64
question_prompt = "question/ask"   # B4a S2; backend follows decider_backend (ollama/mock/replay)
question_prompt_version = 5  # B4a R10: the thing asked about carries no name
memory_prompt = "memory/condense"  # B4a S4: memory condensation (job kind memory)
memory_prompt_version = 6
invention_prompt = "invention/invent"   # D471 D2: inventor
invention_prompt_version = 6
guard_prompt = "guard/invention"        # D471 D2: AI rule guard, own instruction (ADR-0005)
guard_prompt_version = 4
process_prompt = "process/judge"        # B2537 P2 judge of unknown tries
process_prompt_version = 3
dream_prompt = "dream/tell"              # B7 S6 dreams in the computing night
dream_prompt_version = 1
chronicle_prompt = "chronicle/milestone"   # R35 (A1583, D962): the chronicle's sentence for a milestone
chronicle_prompt_version = 1
review_prompt = "review/night"          # A1584: nightly look back (replaces memory + dream)
review_prompt_version = 1
help_prompt = "help/suggest"            # B6 R8/R10 help suggestions for the player (F5238)
help_prompt_version = 1
conversation_prompt = "conversation/reply"  # B6 R13 talking with an inhabitant (A1342)
conversation_prompt_version = 7  # A1617: v6 plus pointing; naming only for the thing pointed at
builder_prompt = "builder/plan"     # D471 D3: building plan from kit parts
builder_prompt_version = 2
question_call_timeout_s = 60.0     # one model call (blocks the model like a decision, so <= the
                                   # core's decision deadline); WAITING in the queue has no limit (B2487)
job_capacity = 256         # generation jobs held in memory (B7); the core resubmits after a restart
keep_alive = "30m"
warm_up = true             # load the model at start; /health says "starting" meanwhile
warm_up_retry_s = 30.0     # a failed warm-up (e.g. Ollama not up yet) is retried

# --- Folders (relative to this file) ---
prompts_dir = "../prompts"
content_dir = "../content"
schemas_dir = "../contracts/schemas"
log_dir = "../.local/ai-service/logs"
sound_output_dir = "../.local/ai-service/sounds"   # D471 D7: made sounds by name pattern
model3d_image_dir = "../.local/ai-service/images"  # B7 S9: input pictures of 3D jobs
model3d_output_dir = "../.local/ai-service/models" # B7 S9: made 3D models (stand-in only)
model3d_backend = "mock"                           # B7 S9: "trellis2" once wired (comfort tier only)
moss_worker_script = "../tools/moss/worker.py"     # runs in the MOSS environment (moss_python)
lock_dir = "../.local/ai-service"   # the game sets GW_AI_LOCK_DIR to the user data folder
