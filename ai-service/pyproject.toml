[project]
name = "glassworld-ai-service"
version = "0.1.0"
description = "Local AI service for GlassWorld (FastAPI on 127.0.0.1): decider, rule guard, model control."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.120,<1",
    "glassworld-contracts",
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "uvicorn>=0.38,<1",
]

[project.scripts]
glassworld-ai = "glassworld_ai.__main__:main"

[tool.uv.sources]
glassworld-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glassworld_ai"]

[tool.pyright]
extends = "../pyproject.toml"
include = ["src", "tests"]
